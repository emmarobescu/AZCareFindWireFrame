<!-- Overlay + Sign-In Sidebar -->
<div id="overlay"></div>
<aside class="signin-sidebar" id="signinSidebar">
  <!-- your existing Sign-In sidebar markup -->
</aside>



<!-- Sidebar JS -->
<script>
/* ---- Sign-in sidebar controls ---- */
  const openBtn  = document.getElementById("openSignin");
  const sidebar  = document.getElementById("signinSidebar");
  const overlay  = document.getElementById("overlay");
  const closeBtn = document.getElementById("closeSignin");

  function toggleSidebar(open) {
    sidebar.classList.toggle("open", open);
    overlay.classList.toggle("active", open);
  }

  if (openBtn)  openBtn.addEventListener("click", () => toggleSidebar(true));
  if (overlay)  overlay.addEventListener("click", () => toggleSidebar(false));
  if (closeBtn) closeBtn.addEventListener("click", () => toggleSidebar(false));
});
</script>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const overlay = document.getElementById("overlay");
  const sidebar = document.getElementById("signinSidebar");
  const closeSidebar = document.getElementById("closeSignin");
  const signinButton = document.querySelector(".signin-btn"); // inside sidebar
  const noAccountPopup = document.getElementById("popupNoAccount");
  const cancelNoAccount = document.getElementById("cancelNoAccount");

  // Sidebar close function (already have this likely)
  function hideSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("active");
  }

  // Clicking the blue "Sign In" button inside sidebar
  signinButton.addEventListener("click", (e) => {
    e.preventDefault(); // prevents any default form submission
    hideSidebar();      // closes the sidebar
    overlay.classList.add("active"); // show dimmed background
    noAccountPopup.classList.add("active"); // open the "Account Not Found" popup
  });

  // Cancel or click outside to close the popup
  cancelNoAccount.addEventListener("click", () => {
    noAccountPopup.classList.remove("active");
    overlay.classList.remove("active");
  });

  overlay.addEventListener("click", () => {
    noAccountPopup.classList.remove("active");
  });
});
</script>

  <script>
// Universal form validation for all forms
document.querySelectorAll("form").forEach((form) => {
  form.addEventListener("submit", (e) => {
    const inputs = form.querySelectorAll("input[required], textarea[required]");
    let valid = true;

    inputs.forEach((input) => {
      // reset any previous red borders
      input.style.outline = "";

      if (!input.value.trim()) {
        valid = false;
        input.style.outline = "2px solid red";
      } else if (input.type === "email") {
        // simple regex for valid email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(input.value.trim())) {
          valid = false;
          input.style.outline = "2px solid red";
        }
      }
    });

    if (!valid) {
      e.preventDefault();
      alert("Please fill out all required fields with valid information before submitting.");
    }
  });
});
</script>
